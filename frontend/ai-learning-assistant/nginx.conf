# HTTP server block: Redirects all port 80 traffic to HTTPS
server {
    listen 80;
    server_name ailearn.krishkr.com;
    
    return 301 https://$host$request_uri;
}

# HTTPS server block: Serves the app securely on port 443
server {
    listen 443 ssl;
    server_name ailearn.krishkr.com;

    # Point to the Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/ailearn.krishkr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ailearn.krishkr.com/privkey.pem;

    # 1. Serve the React static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This line is crucial for React Router to work properly
        try_files $uri $uri/ /index.html; 
    }

    # 2. Proxy API requests to the Node backend container
    location /api/ {
        # 'backend' matches the service name we will use in docker-compose
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward the real IP of the client
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}