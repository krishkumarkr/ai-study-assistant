version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-backend
    restart: always
    expose:
      - "8000"
    # We pass the environment variables from the server to the container
    env_file:
      - ./backend/.env
    volumes:
      # This ensures user uploads aren't lost if the container restarts
      - ./backend/uploads:/usr/src/app/uploads

  frontend:
    build: ./frontend/ai-learning-assistant
    container_name: ai-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend